[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "uv-dynamic-versioning"]

[project]
name = "portsvc"
dynamic = ["version"]
description = "yag ports manager"
authors = [{ name = "acme-im" }]
keywords = ["app"]
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "boto3>=1.35.19,<2",
    "fastapi>=0.142.2,<0.143.0",
    "gunicorn>=23.0.0,<24",
    "jinja2>=3.1.6,<4.0.0",
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "pydantic>=2.13.5,<3.0.0",
    "pyyaml>=6.0.2,<7",
    "requests>=2.32.4,<3",
    "sqlalchemy>=2.1.1,<3.0.0",
    "urllib3>=2,<3",
    "uvicorn>=0.54.0,<0.55.0",
    "uvicorn-worker>=0.4.0,<0.5.0",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "ruff",
]
test = [
    "httpx2>=2.13.1",
    "pytest",
    "pytest-dotenv",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["portsvc"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["portsvc", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit
    "ANN",  # flake8-annotations
    "PL",   # pylint
]
ignore = [
    "ANN401",   # dynamically typed expressions (typing.Any) are allowed
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments
    "PLR0915",  # too many statements
    "PLR2004",  # magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["portsvc"]
force-wrap-aliases = true
combine-as-imports = true

[tool.pyright]
include = ["portsvc"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = "-s -v"
env_files = [
    ".devcontainer/.env",
    ".devcontainer/secrets.env"
]
markers = [
    "integration: marks integration tests",
    "unit: marks unittests"
]
testpaths = "tests"
